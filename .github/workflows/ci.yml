name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: go vet ./...
      - name: K6 probe, the Windows-only tests run verbosely and are counted
        shell: bash
        run: |
          go test -count=1 -v -run 'TestOnWindows|TestNothingIsTransientlyHeldOffWindows|TestAMoveAside' ./internal/selfupdate 2>&1 | tee k6.log
          echo "K6-COUNT os=${{ matrix.os }} windows_pass=$(grep -c -- '^--- PASS: TestOnWindows' k6.log) windows_fail=$(grep -c -- '^--- FAIL: TestOnWindows' k6.log) skip=$(grep -c -- '^--- SKIP' k6.log) logged=$(grep -c 'K6-WINDOWS' k6.log)"
      - run: go test -count=1 ./...
      - run: go build -trimpath -o /dev/null ./cmd/dropin-miner
        if: runner.os != 'Windows'
      - run: go build -trimpath -o NUL ./cmd/dropin-miner
        if: runner.os == 'Windows'
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: go test -race -count=1 ./cmd/...
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make cross
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.x is required for Go 1.25; .golangci.yml is v2 format.
          version: v2.12.2
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...
